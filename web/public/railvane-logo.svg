<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Railvane: windvaan (richting) boven een vangrail (guardrail) -->
  <defs>
    <linearGradient id="rv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#e8463a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#rv-bg)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- vaan: staart en schacht -->
    <path d="M11 12 L18 19 L11 26" stroke-width="4"/>
    <path d="M15 19 H44" stroke-width="4"/>
    <!-- mast -->
    <path d="M32 19 V40" stroke-width="4"/>
    <!-- vangrail-palen -->
    <path d="M15 44 V53 M49 44 V53" stroke-width="4"/>
  </g>
  <!-- pijlpunt en draaipunt -->
  <path d="M42 11 L54 19 L42 27 Z" fill="#fff"/>
  <circle cx="32" cy="19" r="4" fill="#fff"/>
  <!-- vangrail-ligger -->
  <rect x="8" y="38" width="48" height="8" rx="4" fill="#fff"/>
</svg>
