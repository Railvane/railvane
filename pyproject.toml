[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "railvane"
version = "0.5.1"
description = "The guardrails manager for AI coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "webheaven-kit @ git+https://github.com/webheaven-platform/webheaven-kit@v0.2.0#subdirectory=python",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2"]

[project.scripts]
railvane = "railvane.cli:main"

[tool.setuptools.packages.find]
include = ["railvane*"]

[tool.setuptools.package-data]
railvane = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
