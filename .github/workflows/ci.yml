name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly rebuild + scan: catches new CVEs in the base image and dependencies (no push)
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: web
      - run: npm run build
        working-directory: web

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Build first and scan; only a clean image is pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          push: false
          tags: railvane:scan
      # Fails on fixable CRITICAL/HIGH vulnerabilities. Trivy is pinned: a scanner is supply chain too.
      - name: Vulnerability scan (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1
          image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress railvane:scan
      # Image names must be lowercase; the organisation is called "Railvane"
      - id: owner
        if: github.event_name == 'push'
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/railvane
          tags: |
            type=sha,format=short,prefix=
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
